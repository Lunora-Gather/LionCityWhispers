name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        browser: [webkit, chromium]
        shard: [1, 2]
        include:
          - browser: webkit
            os: macos-latest
          - browser: chromium
            os: ubuntu-24.04
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - run: npm run build

      - name: Resolve Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browser
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ms-playwright
            ~/Library/Caches/ms-playwright
          key: playwright-${{ matrix.browser }}-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Install Playwright system dependencies
        if: runner.os == 'Linux' && steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps ${{ matrix.browser }}

      - name: Run Playwright regression tests
        run: |
          args=(--project=${{ matrix.browser }} --shard=${{ matrix.shard }}/2 --workers=1)
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            npm run test:ci -- "${args[@]}" 2>&1 | tee playwright.log
          else
            xvfb-run --auto-servernum npm run test:ci -- --headed "${args[@]}" 2>&1 | tee playwright.log
          fi

      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-${{ matrix.browser }}-${{ matrix.shard }}-diagnostics
          path: |
            playwright.log
            test-results
            playwright-report
          retention-days: 7

  validate:
    needs: browser
    runs-on: ubuntu-24.04
    # bash with pipefail so `cmd | tee log` steps fail when cmd fails, not when tee does.
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck -- --pretty false 2>&1 | tee typecheck.log

      - name: Upload typecheck diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: typecheck-diagnostics
          path: typecheck.log
          retention-days: 7

      - name: Build
        run: npm run build 2>&1 | tee build.log

      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics
          path: build.log
          retention-days: 7

      - name: Verify static export build (GitHub Pages target)
        run: npm run build:pages 2>&1 | tee build-pages.log

      - name: Upload static export diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-pages-diagnostics
          path: build-pages.log
          retention-days: 7

      - name: Audit game assets
        run: npm run audit:game

      - name: Audit dependencies
        run: |
          for attempt in 1 2 3; do
            set +e
            npm run audit:security 2>&1 | tee audit-security.log
            status=${PIPESTATUS[0]}
            set -e

            if [ "$status" -eq 0 ]; then
              exit 0
            fi

            if ! grep -q "audit endpoint returned an error" audit-security.log; then
              exit "$status"
            fi

            sleep $((attempt * 5))
          done

          echo "::warning::npm audit endpoint remained unavailable after 3 attempts."
